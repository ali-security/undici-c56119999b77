name: Lint
# SEAL: dispatch-only, and the job itself is disabled. `standard` reports
# `padded-blocks` on pristine, published `lib/` sources in this undici line, and the
# only way to silence it would be to edit files that ship in the tarball, which
# breaks byte parity with the public artifact. Lint is a style gate: it executes no
# test and nothing we ship depends on it.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  lint:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: lts/*
      - run: npm install
      - run: npm run lint
